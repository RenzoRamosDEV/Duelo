[project]
name = "duelo"
version = "0.1.0"
description = "Duelo backend - hexagonal monolith (API, platform worker, agents worker)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "temporalio>=1.34",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "testcontainers[postgres]>=4.9",
    "hypothesis>=6.100",
    "mutmut>=3.8",
    "schemathesis>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duelo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=duelo --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source = ["src/duelo"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Set curado, no `ALL`: familias que detectan errores o deuda real sobre mypy strict.
select = [
    "E", "F", "I", "UP", "B",
    "SIM",  # simplificaciones
    "RUF",  # reglas de Ruff, incluida RUF100 (noqa sin efecto)
    "PTH",  # pathlib en vez de os.path
    "PT",   # estilo de pytest
    "ARG",  # argumentos sin uso
    "C4",   # comprensiones
    "RET",  # returns
    "TRY",  # excepciones
    "S",    # bandit
    "A",    # sombra de builtins
    "BLE",  # `except Exception` sin motivo
    "SLF",  # acceso a miembros privados
    "PERF", # patrones lentos
    "PIE",  # misceláneas
    "T20",  # print
    "ISC",  # concatenación implícita de cadenas
    "N",    # nombres
]
ignore = [
    # Los mensajes de las excepciones del proyecto van en el `raise`: son texto para el usuario,
    # no una clase por mensaje.
    "TRY003",
    # Las excepciones se llaman por lo que ocurre (`ProjectNotFound`, `RetryNotAllowed`); el
    # sufijo `Error` no aporta y renombrarlas sería un diff enorme sin valor.
    "N818",
    # La documentación en español usa «», … y guiones tipográficos a propósito.
    "RUF001", "RUF002", "RUF003",
    # Las aserciones compuestas de los tests son legibles tal cual.
    "PT018",
    # Todas las llamadas a subprocesos son listas de argumentos sin shell y los binarios (`git`,
    # `gh`, los CLI) se resuelven por `PATH` por diseño; ver `adapters/subprocess_runner.py`.
    "S603", "S607",
]

[tool.ruff.lint.per-file-ignores]
# Tests: `assert`, tokens y rutas de prueba, estado privado de los fakes, y fakes que implementan
# protocolos con parámetros que no usan. `PT011`: los tests comprueban el mensaje exacto justo después.
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "SLF001", "ARG", "PT011"]

[tool.ruff.lint.isort]
# El directorio de migraciones backend/alembic/ comparte nombre con el paquete
# de terceros `alembic`; sin esto, la detección de primera/tercera parte de
# ruff clasifica los imports de `alembic` de forma inconsistente.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["duelo"]

[tool.importlinter]
root_package = "duelo"

[[tool.importlinter.contracts]]
name = "Hexagonal layering: domain <- application <- adapters/entrypoints/workflows"
type = "layers"
layers = [
    "duelo.entrypoints | duelo.adapters | duelo.workflows",
    "duelo.application",
    "duelo.domain",
]

[tool.mutmut]
# Solo domain/ y application/: son puros y sus tests no necesitan contenedores.
source_paths = ["src/duelo/domain/", "src/duelo/application/"]
pytest_add_cli_args_test_selection = ["tests/unit/domain", "tests/unit/application"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "--no-cov"]
